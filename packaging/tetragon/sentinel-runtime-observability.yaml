# LAB-ONLY PROFILE — do not install fleet-wide without workload-specific filters
# and event-volume/loss evaluation. vfs_read, do_sys_openat2 and tcp_sendmsg are
# high-frequency hooks. vfs_read and do_sys_openat2 are filtered in-kernel to
# sensitive paths; tune the path set to the workload and validate loss before
# deployment. All probes are observational; this policy does not authorize
# containment or other host changes. Return types use explicit Tetragon
# v1.8-compatible scalar types.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: sentinel-runtime-observability
spec:
  kprobes:
    - call: do_sys_openat2
      syscall: false
      args:
        - index: 0
          type: int
          label: sentinel_dfd
        - index: 1
          type: string
          label: sentinel_filename
      return: true
      returnArg:
        index: 0
        type: int
      selectors:
        - matchArgs:
            - index: 1
              operator: Prefix
              values:
                - /etc/passwd
                - /etc/shadow
                - /etc/sudoers
                - /etc/ssh/
                - /root/.ssh/
                - /etc/ssl/private/
    - call: vfs_read
      syscall: false
      args:
        - index: 0
          type: file
          label: sentinel_file
        - index: 2
          type: size_t
          label: sentinel_count
      return: true
      returnArg:
        index: 0
        type: long
      selectors:
        - matchBinaries:
            - operator: In
              values:
                - /usr/bin/python3
                - /usr/bin/python3.12
                - /usr/bin/dash
          matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /etc/passwd
                - /etc/shadow
                - /etc/sudoers
                - /etc/ssh/
                - /root/.ssh/
                - /etc/ssl/private/
    - call: tcp_v4_connect
      syscall: false
      args:
        - index: 0
          type: sock
          label: sentinel_socket
        - index: 1
          type: sockaddr
          label: sentinel_sockaddr
      return: true
      returnArg:
        index: 0
        type: int
    - call: tcp_v6_connect
      syscall: false
      args:
        - index: 0
          type: sock
          label: sentinel_socket
        - index: 1
          type: sockaddr
          label: sentinel_sockaddr
      return: true
      returnArg:
        index: 0
        type: int
    - call: tcp_sendmsg
      syscall: false
      args:
        - index: 0
          type: sock
          label: sentinel_socket
        - index: 2
          type: size_t
          label: sentinel_size
      return: true
      returnArg:
        index: 0
        type: int
      selectors:
        - matchBinaries:
            - operator: In
              values:
                - /usr/bin/python3
                - /usr/bin/python3.12
                - /usr/bin/dash
